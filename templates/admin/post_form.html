{% extends "admin/layout.html" %}
{% block title %}{{ '글 수정' if post else '새 글 쓰기' }}{% endblock %}
{% block admin %}
<h1>{{ '활동 글 수정' if post else '새 활동 글 쓰기' }}</h1>
<form method="post" class="form">
  <label class="field">제목<input name="title" required maxlength="200" value="{{ post.title if post else '' }}"></label>
  <label class="field">분류
    <select name="category">
      {% for c in categories %}<option {{ 'selected' if post and post.category == c }}>{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label class="field">요약 (목록에 보이는 한 줄 소개)<input name="summary" maxlength="300" value="{{ post.summary if post else '' }}"></label>
  <label class="field">본문<textarea name="content" rows="12" required>{{ post.content if post else '' }}</textarea></label>
  <label class="field">사진 주소 (선택, https:// 로 시작하는 이미지 링크)<input name="image_url" maxlength="500" value="{{ post.image_url if post else '' }}"></label>
  <div class="actions">
    <button class="btn btn-primary">저장하기</button>
    <a class="btn btn-outline" href="/admin/posts">취소</a>
  </div>
</form>
{% endblock %}
