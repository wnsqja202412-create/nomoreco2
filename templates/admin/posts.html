{% extends "admin/layout.html" %}
{% block title %}활동 글 관리{% endblock %}
{% block admin %}
<div class="section-head">
  <h1>활동 글 관리</h1>
  <a class="btn btn-primary" href="/admin/posts/new">+ 새 글 쓰기</a>
</div>
<div class="table-wrap"><table class="table">
  <tr><th>날짜</th><th>분류</th><th>제목</th><th></th></tr>
  {% for p in items %}
    <tr>
      <td>{{ p.created_at|datefmt }}</td>
      <td>{{ p.category }}</td>
      <td><a href="/activities/{{ p.id }}">{{ p.title }}</a></td>
      <td class="actions">
        <a class="btn btn-sm btn-outline" href="/admin/posts/{{ p.id }}/edit">수정</a>
        <form method="post" action="/admin/posts/{{ p.id }}/delete" class="inline" onsubmit="return confirm('정말 지울까요?')">
          <button class="btn btn-sm btn-danger">삭제</button>
        </form>
      </td>
    </tr>
  {% else %}<tr><td colspan="4" class="muted">글이 없어요</td></tr>{% endfor %}
</table></div>
{% endblock %}
